<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Horizontal "track" that we scroll to reveal more poems. */
        #hscroll {
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-gutter: stable both-edges;
        }

        #canvas {
            position: relative;
            height: 100vh;
        }

        .poemdiv {
            position: absolute;
            top: 0;
            padding: 20px;
            width: 500px;
            box-sizing: border-box;
            height: 100vh;
            white-space: pre-wrap;
        }

        #animated-letters {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        .animated-letter {
            position: absolute;
            will-change: transform;
            backface-visibility: hidden;
        }

        /* Set from beforeprint to afterprint so the frame is measured in its print layout. */
        html.is-printing #hscroll {
            overflow: visible;
            scrollbar-gutter: auto;
        }

        @page {
            size: A4 portrait;
            margin: 0;
        }

        @media print {
            html, body {
                overflow: visible;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            #hscroll {
                overflow: visible;
                scrollbar-gutter: auto;
            }

            /* Full-page heights round up into a blank second page in Firefox. */
            #hscroll, #canvas, .poemdiv {
                height: auto;
            }

            /* Fixed elements repeat on every printed page. */
            #animated-letters {
                position: absolute;
            }
        }
    </style>
</head>
<body>
    <div id="hscroll">
        <div id="canvas"></div>
    </div>
    <div id="animated-letters"></div>

        ].map((poem) => poem.replace(/^\n/, '').replace(/\n$/, '').toLowerCase());

        function getPoemANumber() {
            const n = parseInt(new URLSearchParams(window.location.search).get('a'), 10);
            return (n >= 1 && n <= ALL_POEMS.length) ? n : DEFAULT_POEM_A;
        }

        const poemANumber = getPoemANumber();
        const poemBNumber = (poemANumber % ALL_POEMS.length) + 1;
        const poemA = ALL_POEMS[poemANumber - 1];
        const poemB = ALL_POEMS[poemBNumber - 1];
        document.title = `views-of-the-sea-${String(poemANumber).padStart(2, '0')}-${String(poemBNumber).padStart(2, '0')}`;

        const poems = [poemA, poemB];

        // Layout: fixed horizontal "columns" that we scroll through.
        const POEM_WIDTH = 500; // must match .poemdiv width
        const POEM_GAP = 400;
        const COLUMN_WIDTH = POEM_WIDTH + POEM_GAP;

        // Mouse morph: outside this band, poems are fully readable.
        const morphMin = 0.2;
        const morphMax = 0.8;

        const isLetterChar = (ch) => /[a-zA-Z]/.test(ch);

        let poemDivs = [];
        let poemSpans = []; // spans per poem: [poemIndex] => HTMLElement[]
        let pairMappings = []; // mappings for poem i -> i+1
        let activeFromIndex = 0;
        let activeToIndex = 1;
        let activeZone = null; // 'from' | 'morph' | 'to'
        let activePair = [];
        let mouseClientX = window.innerWidth / 2;
        let rafScheduled = false;
        let isPrinting = false; // freezes animation, input, and resize rebuilds

        const hscroll = document.getElementById('hscroll');
        const canvas = document.getElementById('canvas');
        const animContainer = document.getElementById('animated-letters');

        function render_poem(poem, div) {
            poem.split('').forEach((char, i) => {
                if (char === '\n') {
                    div.appendChild(document.createElement('br'));
                } else {
                    const span = document.createElement('span');
                    span.textContent = char;
                    span.className = char.match(/[a-zA-Z]/) ? 'letter' : 'static';
                    div.appendChild(span);
                }
            });
        }

        function getRandomArbitrary(min, max) {
            return Math.random() * (max - min) + min;
        }

        function lerp(start, end, t) {
            return start + (end - start) * t;
        }

        function remapPercent(percent, newMin, newMax) {
            // Map percent in [newMin,newMax] to [0,1]
            const denom = (newMax - newMin);
            if (!Number.isFinite(denom) || denom === 0) return 0;
            const t = (percent - newMin) / denom;
            return Math.max(0, Math.min(1, t));
        }

        function hideAllSpansForPoem(poemIndex) {
            poemSpans[poemIndex].forEach((span) => {
                span.style.visibility = 'hidden';
            });
        }

        function showAllSpansForPoem(poemIndex) {
            poemSpans[poemIndex].forEach((span) => {
                span.style.visibility = 'visible';
            });
        }

        function buildPairLetterMapping(fromIndex, toIndex) {
            const fromDiv = poemDivs[fromIndex];
            const toDiv = poemDivs[toIndex];
            const fromSpans = poemSpans[fromIndex];
            const toSpans = poemSpans[toIndex];

            const letters = [];
            const queues = new Map(); // char -> [letters[] indices]

            let letterIndexA = 0;
            fromSpans.forEach((span, indexA) => {
                const ch = span.textContent;
                if (!isLetterChar(ch)) return;

                const itemIndex = letters.length;
                letters.push({
                    type: 'letter',
                    char: ch,
                    indexA,
                    letterIndexA: letterIndexA++,
                    mapped: false
                });

                if (!queues.has(ch)) queues.set(ch, []);
                queues.get(ch).push(itemIndex);
            });

            const ptrByChar = new Map();
            toSpans.forEach((span, indexB) => {
                const ch = span.textContent;
                if (!isLetterChar(ch)) return;

                const queue = queues.get(ch);
                if (!queue || queue.length === 0) return;

                const ptr = ptrByChar.get(ch) ?? 0;
                if (ptr >= queue.length) return;

                const item = letters[queue[ptr]];
                ptrByChar.set(ch, ptr + 1);

                item.indexB = indexB;
                item.letterIndexB = ptr;
                item.mapped = true;
            });

            // Only animate letters that exist in both poems.
            const matched = letters.filter((item) => item.indexB != null);

            matched.forEach((item) => {
                const letterEl = document.createElement('span');
                letterEl.textContent = item.char;
                letterEl.className = 'animated-letter';
                letterEl.style.visibility = 'hidden';
                animContainer.appendChild(letterEl);

                item.element = letterEl;

                item.mStart = getRandomArbitrary(morphMin, 0.4);
                item.mEnd = getRandomArbitrary(0.6, morphMax);
            });

            return matched;
        }

        function getCanvasWidth() {
            // Each poem "stop" is one COLUMN_WIDTH of scroll. The last stop needs
            // enough trailing space to bring the final poem into the viewport.
            const scrollExtent = (poems.length - 1) * COLUMN_WIDTH + hscroll.clientWidth;
            const contentExtent = (poems.length - 1) * COLUMN_WIDTH + POEM_WIDTH;
            return Math.max(scrollExtent, contentExtent);
        }

        // Mouse X in canvas/content coordinates (scroll + viewport position).
        function getCanvasMouseX() {
            const hscrollRect = hscroll.getBoundingClientRect();
            return hscroll.scrollLeft + (mouseClientX - hscrollRect.left);
        }

        // Pair + morph progress from canvas X. Swap for server-provided X later.
        function getProgressFromCanvasX() {
            const maxGlobalT = poems.length - 1;
            const globalT = Math.max(0, Math.min(maxGlobalT, getCanvasMouseX() / COLUMN_WIDTH));
            const fromIndex = Math.min(Math.floor(globalT), poems.length - 2);
            const toIndex = fromIndex + 1;
            const morphProgress = Math.max(0, Math.min(1, globalT - fromIndex));
            return { fromIndex, toIndex, morphProgress };
        }

        function scheduleAnimate() {
            if (rafScheduled) return;
            rafScheduled = true;
            requestAnimationFrame(animate);
        }

        function onMouseMove(e) {
            if (isPrinting) return;
            mouseClientX = e.clientX;
            scheduleAnimate();
        }

        function onScroll() {
            scheduleAnimate();
        }

        function animate() {
            rafScheduled = false;
            if (isPrinting) return;
            renderFrame();
        }

        function renderFrame() {
            const { fromIndex, toIndex, morphProgress } = getProgressFromCanvasX();

            const nextZone = morphProgress < morphMin ? 'from' : (morphProgress > morphMax ? 'to' : 'morph');
            const pairChanged = fromIndex !== activeFromIndex || toIndex !== activeToIndex;

            if (pairChanged) {
                // Hide previous pair spans and any animated letters for that pair.
                hideAllSpansForPoem(activeFromIndex);
                hideAllSpansForPoem(activeToIndex);
                activePair.forEach((item) => item.element.style.visibility = 'hidden');

                activeFromIndex = fromIndex;
                activeToIndex = toIndex;
                activePair = pairMappings[activeFromIndex] || [];
                activeZone = null; // force zone handling below
            }

            if (nextZone !== activeZone) {
                if (nextZone === 'from') {
                    showAllSpansForPoem(activeFromIndex);
                    hideAllSpansForPoem(activeToIndex);
                    activePair.forEach((item) => item.element.style.visibility = 'hidden');
                } else if (nextZone === 'to') {
                    showAllSpansForPoem(activeToIndex);
                    hideAllSpansForPoem(activeFromIndex);
                    activePair.forEach((item) => item.element.style.visibility = 'hidden');
                } else {
                    // Morph zone: start with both poems hidden; per-letter logic will re-show some.
                    hideAllSpansForPoem(activeFromIndex);
                    hideAllSpansForPoem(activeToIndex);
                    activePair.forEach((item) => item.element.style.visibility = 'hidden');
                }
                activeZone = nextZone;
            }

            if (nextZone !== 'morph') return;

            // Update positions for active pair's animated letters.
            activePair.forEach((item) => {
                const fromSpan = poemSpans[activeFromIndex][item.indexA];
                const toSpan = poemSpans[activeToIndex][item.indexB];

                if (morphProgress < item.mStart) {
                    fromSpan.style.visibility = 'visible';
                    toSpan.style.visibility = 'hidden';
                    item.element.style.visibility = 'hidden';
                } else if (morphProgress > item.mEnd) {
                    fromSpan.style.visibility = 'hidden';
                    toSpan.style.visibility = 'visible';
                    item.element.style.visibility = 'hidden';
                } else {
                    const remappedT = remapPercent(morphProgress, item.mStart, item.mEnd);

                    fromSpan.style.visibility = 'hidden';
                    toSpan.style.visibility = 'hidden';
                    item.element.style.visibility = 'visible';

                    const fromRect = fromSpan.getBoundingClientRect();
                    const toRect = toSpan.getBoundingClientRect();
                    const x = lerp(fromRect.left, toRect.left, remappedT);
                    const y = lerp(fromRect.top, toRect.top, remappedT);
                    item.element.style.transform = `translate3d(${x}px, ${y}px, 0)`;
                }
            });
        }

        function rebuild() {
            // Clear old content.
            canvas.querySelectorAll('.poemdiv').forEach((el) => el.remove());
            animContainer.innerHTML = '';

            poemDivs = [];
            poemSpans = [];
            pairMappings = [];

            // Size the canvas so we can scroll to every poem's readable position.
            canvas.style.width = `${getCanvasWidth()}px`;

            poems.forEach((poem, i) => {
                const div = document.createElement('div');
                div.className = 'poemdiv';
                div.id = `poem-${i}`;
                div.style.left = `${i * COLUMN_WIDTH}px`;
                canvas.appendChild(div);

                render_poem(poem, div);
                poemDivs.push(div);

                const spans = Array.from(div.querySelectorAll('span'));
                poemSpans.push(spans);
                // Start hidden; we'll show the active poem on first animate().
                spans.forEach((span) => (span.style.visibility = 'hidden'));
            });

            // Precompute pair mappings and animated letter elements.
            for (let i = 0; i < poems.length - 1; i++) {
                pairMappings[i] = buildPairLetterMapping(i, i + 1);
            }

            // Initialize visible state.
            activeFromIndex = 0;
            activeToIndex = 1;
            activePair = pairMappings[0] || [];
            activeZone = null;

            // Force initial render state.
            // We want poem0 readable at scrollLeft=0.
            showAllSpansForPoem(activeFromIndex);
            hideAllSpansForPoem(activeToIndex);
            activePair.forEach((item) => item.element.style.visibility = 'hidden');
        }

        let resizeTimer = null;
        let resizedWhilePrinting = false;
        window.addEventListener('resize', () => {
            if (isPrinting) {
                resizedWhilePrinting = true;
                return;
            }
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                resizeTimer = null;
                if (isPrinting) return;
                rebuild();
                animate();
            }, 150);
        });

        function getVisibleRect(el) {
            if (!el.textContent.trim()) return null;
            const rect = el.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return null;
            if (el.checkVisibility && !el.checkVisibility({ opacityProperty: true, visibilityProperty: true })) return null;
            const style = getComputedStyle(el);
            if (style.display === 'none' || style.visibility !== 'visible' || parseFloat(style.opacity) === 0) return null;
            if (style.color === 'transparent' || /^rgba\(.*,\s*0(\.0*)?\)$/.test(style.color)) return null;
            return rect;
        }

        function getVisibleLettersBounds() {
            let left = Infinity;
            let right = -Infinity;
            document.querySelectorAll(PRINT_LETTER_SELECTOR).forEach((el) => {
                const rect = getVisibleRect(el);
                if (!rect) return;
                left = Math.min(left, rect.left);
                right = Math.max(right, rect.right);
            });
            return Number.isFinite(left) ? { left, right } : null;
        }

        function hasLettersInPlace(poemIndex) {
            return poemSpans[poemIndex].some((span) => getVisibleRect(span));
        }

        function getPoemTextLeft(poemIndex) {
            const div = poemDivs[poemIndex];
            return div.getBoundingClientRect().left + parseFloat(getComputedStyle(div).paddingLeft);
        }

        function getPrintOffset() {
            const poemMarginPx = PRINT_POEM_MARGIN_IN * CSS_PX_PER_IN;
            if (hasLettersInPlace(activeFromIndex)) {
                return { mode: 'left poem', offset: poemMarginPx - getPoemTextLeft(activeFromIndex) };
            }
            if (hasLettersInPlace(activeToIndex)) {
                return { mode: 'right poem', offset: poemMarginPx - getPoemTextLeft(activeToIndex) };
            }
            const bounds = getVisibleLettersBounds();
            if (!bounds) return null;
            return { mode: 'in motion', offset: PRINT_MOTION_MARGIN_IN * CSS_PX_PER_IN - bounds.left };
        }

        let savedScrollLeft = 0;
        let savedMouseClientX = 0;

        window.addEventListener('beforeprint', () => {
            if (isPrinting) return;
            isPrinting = true;
            if (resizeTimer) {
                clearTimeout(resizeTimer);
                resizeTimer = null;
            }

            // Switch #hscroll to its print layout (no scrolling), then re-render the
            // same frame at the same canvas X so static and moving letters line up.
            savedScrollLeft = hscroll.scrollLeft;
            savedMouseClientX = mouseClientX;
            const canvasX = getCanvasMouseX();
            document.documentElement.classList.add('is-printing');
            mouseClientX = canvasX + hscroll.getBoundingClientRect().left;
            renderFrame();

            const reframe = getPrintOffset();
            if (!reframe) return;
            document.documentElement.style.transform = `translateX(${reframe.offset}px)`;

            const bounds = getVisibleLettersBounds();
            const printedRight = bounds.right + reframe.offset;
            console.log('print reframe', { ...reframe, printedLeft: bounds.left + reframe.offset, printedRight });
            if (printedRight > PRINT_PAGE_WIDTH_PX) {
                console.warn(`print reframe: visible letters reach ${Math.round(printedRight)}px, past the page width (${PRINT_PAGE_WIDTH_PX}px)`);
            }
        });

        window.addEventListener('afterprint', () => {
            if (!isPrinting) return;
            document.documentElement.style.transform = '';
            document.documentElement.classList.remove('is-printing');
            hscroll.scrollLeft = savedScrollLeft;
            mouseClientX = savedMouseClientX;
            isPrinting = false;

            if (resizedWhilePrinting) {
                resizedWhilePrinting = false;
                rebuild();
            }
            renderFrame();
        });

        function countLetters(poem) {
            const counts = new Map();
            for (const ch of poem) {
                if (isLetterChar(ch)) counts.set(ch, (counts.get(ch) ?? 0) + 1);
            }
            return counts;
        }

        function alertUnmatchedLetters() {
            const countsA = countLetters(poemA);
            const countsB = countLetters(poemB);
            const chars = [...new Set([...countsA.keys(), ...countsB.keys()])].sort();

            const extraA = [];
            const extraB = [];
            chars.forEach((ch) => {
                const diff = (countsA.get(ch) ?? 0) - (countsB.get(ch) ?? 0);
                if (diff > 0) extraA.push(`${ch} ×${diff}`);
                if (diff < 0) extraB.push(`${ch} ×${-diff}`);
            });
            if (extraA.length === 0 && extraB.length === 0) return;

            const lines = [`Not all letters match between poem ${poemANumber} and poem ${poemBNumber}.`];
            if (extraA.length) lines.push(`\nOnly in poem ${poemANumber}: ${extraA.join(', ')}`);
            if (extraB.length) lines.push(`\nOnly in poem ${poemBNumber}: ${extraB.join(', ')}`);
            alert(lines.join('\n'));
        }

        document.addEventListener('DOMContentLoaded', () => {
            rebuild();
            animate();
            alertUnmatchedLetters();
            hscroll.addEventListener('scroll', onScroll, { passive: true });
            document.addEventListener('mousemove', onMouseMove);
        });
    </script>
</body>
</html>
